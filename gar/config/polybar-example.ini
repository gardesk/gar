; Polybar config for gar window manager
; Copy to ~/.config/polybar/config.ini
;
; Launch with: polybar gar &
; Or add to your gar init.lua: gar.exec_once("polybar gar")

[colors]
background = #1a1a2e
background-alt = #2d2d44
foreground = #e0e0e0
primary = #5294e2
secondary = #6c7a89
alert = #ff5555
disabled = #707880

[bar/gar]
width = 100%
height = 24pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
border-size = 0
padding-left = 1
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}

font-0 = "monospace:size=10;2"
font-1 = "Font Awesome 6 Free:style=Solid:size=10;2"

modules-left = xworkspaces xwindow
modules-right = pulseaudio memory cpu wlan battery date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; This is critical - tells polybar to use EWMH
wm-restack = generic

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
label-connected = %essid%
format-disconnected = <label-disconnected>
label-disconnected = offline
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = AC
poll-interval = 5
label-charging = CHG %percentage%%
label-discharging = BAT %percentage%%
label-full = FULL
label-low = LOW %percentage%%
label-low-foreground = ${colors.alert}

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true
