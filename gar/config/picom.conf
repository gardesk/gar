# picom.conf - Compositor configuration for gar window manager
# Copy to ~/.config/gar/picom.conf and customize
#
# This config enables modern visual effects similar to Hyprland:
# - Rounded corners
# - Background blur (dual_kawase)
# - Window shadows
# - Fade animations
#
# Requires picom v12+ with GLX backend

# =============================================================================
# Backend Configuration
# =============================================================================
backend = "glx";
vsync = true;

# Use EWMH _NET_ACTIVE_WINDOW for focus detection (required for gar)
use-ewmh-active-win = true;

# GLX backend optimizations
glx-no-rebind-pixmap = true;

# =============================================================================
# Rounded Corners
# =============================================================================
corner-radius = 12;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    # Exclude fullscreen windows
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# =============================================================================
# Blur
# =============================================================================
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-kern = "3x3box";

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    # Windows requesting compositor bypass (fullscreen games/video)
    "_NET_WM_BYPASS_COMPOSITOR@:32c = 1"
];

# =============================================================================
# Shadows
# =============================================================================
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.75;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "window_type = 'tooltip'",
    # Exclude fullscreen windows
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
    "_NET_WM_BYPASS_COMPOSITOR@:32c = 1"
];

# =============================================================================
# Fading / Animations
# =============================================================================
fading = true;
fade-in-step = 0.028;
fade-out-step = 0.03;
fade-delta = 10;

# Don't fade destroyed windows (can cause visual glitches)
no-fading-destroyed-argb = true;

fade-exclude = [
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'"
];

# =============================================================================
# Focus Opacity (Optional)
# =============================================================================
# Uncomment to dim unfocused windows
# inactive-opacity = 0.9;
# active-opacity = 1.0;
# frame-opacity = 1.0;

# =============================================================================
# Window Type Settings
# =============================================================================
wintypes:
{
    tooltip = {
        fade = true;
        shadow = false;
        opacity = 0.95;
        focus = true;
        blur-background = false;
    };
    dock = {
        shadow = false;
        clip-shadow-above = true;
    };
    dnd = {
        shadow = false;
    };
    popup_menu = {
        opacity = 0.95;
        shadow = false;
    };
    dropdown_menu = {
        opacity = 0.95;
        shadow = false;
    };
};

# =============================================================================
# Experimental / Debug
# =============================================================================
# Useful for debugging rendering issues
# log-level = "warn";
# log-file = "/tmp/picom.log";
